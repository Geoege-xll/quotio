name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

env:
  PROJECT_NAME: QuotioPlus

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # ===========================================
      # 1. Checkout
      # ===========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================
      # 2. Setup Xcode
      # ===========================================
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      # ===========================================
      # 3. Extract version from tag or input
      # ===========================================
      - name: Get version
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # 版本通过环境变量传入并验证，不能将输入直接展开为 shell 代码。
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          # 标签必须对应已提交的版本与发行说明；CI 不追加版本提交，保证首发历史只有一个二开提交。
          PROJECT_VERSION=$(awk '/MARKETING_VERSION = / {gsub(";", "", $3); print $3; exit}' Quotio.xcodeproj/project.pbxproj)
          [[ "${PROJECT_VERSION}" == "${VERSION}" ]] || { echo "请先提交对应版本配置"; exit 1; }
          [[ -f "docs/releases/${VERSION}.md" ]] || { echo "缺少已提交的发行说明"; exit 1; }
          # 既有版本只能重跑同一提交，不能把别的源码产物覆盖到相同发行标签下。
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            [[ "$(git rev-parse "v${VERSION}^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo "标签指向其他提交"; exit 1; }
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          # Check if beta
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Releasing version: ${VERSION}"

      # ===========================================
      # 4. Build release artifacts
      # ===========================================
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Configure Developer ID signing and notarization
        id: signing
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            DEVELOPER_ID_CERTIFICATE_BASE64
            DEVELOPER_ID_CERTIFICATE_PASSWORD
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
          )

          configured_secret_count=0
          for secret_name in "${required_secrets[@]}"; do
            if [[ -n "${!secret_name}" ]]; then
              configured_secret_count=$((configured_secret_count + 1))
            fi
          done

          if [[ "${configured_secret_count}" -eq 0 ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Apple signing secrets are not configured; building ad-hoc artifacts."
            exit 0
          fi

          if [[ "${configured_secret_count}" -ne "${#required_secrets[@]}" ]]; then
            echo "Developer ID signing is only enabled when all Apple signing secrets are configured." >&2
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                echo "Missing GitHub secret: ${secret_name}" >&2
              fi
            done
            exit 1
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/quotio-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          NOTARY_PROFILE="quotio-notarization-${GITHUB_RUN_ID}"
          ORIGINAL_KEYCHAINS_PATH="${RUNNER_TEMP}/quotio-original-keychains.txt"

          security list-keychains -d user > "${ORIGINAL_KEYCHAINS_PATH}"
          {
            echo "SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "SIGNING_CERTIFICATE_PATH=${CERTIFICATE_PATH}"
            echo "NOTARY_API_KEY_PATH=${API_KEY_PATH}"
            echo "SIGNING_ORIGINAL_KEYCHAINS_PATH=${ORIGINAL_KEYCHAINS_PATH}"
          } >> "${GITHUB_ENV}"

          printf '%s' "${DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${APP_STORE_CONNECT_API_KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("${keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${existing_keychains[@]}"

          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
              | awk '/Developer ID Application/ && !identity {identity=$2} END {print identity}'
          )"
          if [[ -z "${SIGNING_IDENTITY}" ]]; then
            echo "The imported certificate is not a valid Developer ID Application identity." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "${NOTARY_PROFILE}" \
            --key "${API_KEY_PATH}" \
            --key-id "${APP_STORE_CONNECT_KEY_ID}" \
            --issuer "${APP_STORE_CONNECT_ISSUER_ID}" \
            --keychain "${KEYCHAIN_PATH}"

          {
            echo "SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "NOTARYTOOL_KEYCHAIN_PROFILE=${NOTARY_PROFILE}"
            echo "NOTARYTOOL_KEYCHAIN=${KEYCHAIN_PATH}"
          } >> "${GITHUB_ENV}"
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Build release artifacts
        id: artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # 公钥不是秘密，使用自有仓库变量；打包脚本会验证它与私钥及包内配置匹配。
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          args=(--version "${RELEASE_VERSION}")
          # 公钥解析与打包脚本一致：仓库变量优先，其次采用版本内 Updates.xcconfig 的公钥。
          export SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-$(awk '/^SPARKLE_PUBLIC_ED_KEY = / { print $3; exit }' Config/Updates.xcconfig)}"
          # 首发允许手动更新构建；自动更新只有公私钥成对配置时才发布，半配置仍明确失败。
          if [[ -n "${SPARKLE_PRIVATE_KEY}" && -n "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            args+=(--generate-appcast)
            echo "has_appcast=true" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${SPARKLE_PRIVATE_KEY}" || -n "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            echo "Sparkle 公钥与私钥必须同时配置" >&2
            exit 1
          else
            echo "has_appcast=false" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            args+=(--distribution)
          fi
          ./scripts/build_dmg.sh "${args[@]}"
          git diff --exit-code -- CHANGELOG.md Quotio.xcodeproj/project.pbxproj

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          HAS_APPCAST: ${{ steps.artifacts.outputs.has_appcast }}
        run: |
          set -euo pipefail
          # 使用版本内的人工整理说明，避免首个标签自动列出全部上游开发历史。
          cp "docs/releases/${RELEASE_VERSION}.md" build/release/release-notes.md
          printf '\n## 构建与更新\n\n' >> build/release/release-notes.md
          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            printf '%s\n\n' '本安装包已经过 Developer ID 签名和 Apple 公证。' 'This build is Developer ID signed and notarized by Apple.' >> build/release/release-notes.md
          else
            printf '%s\n\n' '本安装包使用临时签名，未经 Developer ID 签名和 Apple 公证；macOS 可能要求额外确认。' 'This build uses ad-hoc signing and is not Developer ID signed or notarized. macOS may require additional confirmation.' >> build/release/release-notes.md
          fi
          if [[ "${HAS_APPCAST}" == "true" ]]; then
            printf '%s\n\n' '已提供使用本项目密钥签名的 Sparkle 自动更新文件。' 'A Sparkle update feed signed with this project’s own key is included.' >> build/release/release-notes.md
          else
            printf '%s\n\n' '本构建使用发布页手动更新，未启用 Sparkle 自动安装。' 'Update manually through this release page; automatic Sparkle installation is not enabled.' >> build/release/release-notes.md
          fi

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${SIGNING_ORIGINAL_KEYCHAINS_PATH:-}" && -f "${SIGNING_ORIGINAL_KEYCHAINS_PATH}" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              original_keychains+=("${keychain//\"/}")
            done < "${SIGNING_ORIGINAL_KEYCHAINS_PATH}"
            security list-keychains -d user -s "${original_keychains[@]}" || true
          fi
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true
          fi
          for credential_file in \
            "${SIGNING_CERTIFICATE_PATH:-}" \
            "${NOTARY_API_KEY_PATH:-}" \
            "${SIGNING_ORIGINAL_KEYCHAINS_PATH:-}"; do
            if [[ -n "${credential_file}" ]]; then
              rm -f "${credential_file}"
            fi
          done

      # ===========================================
      # 5. Create tag (for workflow_dispatch)
      # ===========================================
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          TAG_NAME="v${RELEASE_VERSION}"
          if ! git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            # GitHub 新 runner 没有默认作者身份，创建附注标签前显式使用工作流机器人。
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "QuotioPlus ${RELEASE_VERSION}"
            git push origin "${TAG_NAME}"
          fi

      # ===========================================
      # 6. Create GitHub Release
      # ===========================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.VERSION }}
          files: |
            build/release/*.dmg
            build/release/*.zip
            build/release/appcast.xml
          generate_release_notes: false
          body_path: build/release/release-notes.md
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}

      # ===========================================
      # 7. Update latest stable release with merged appcast
      # ===========================================
      - name: Update latest stable appcast
        if: steps.version.outputs.IS_PRERELEASE == 'true' && steps.artifacts.outputs.has_appcast == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest stable release tag
          LATEST_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          
          if [ -n "$LATEST_STABLE" ]; then
            echo "Updating appcast on latest stable release: $LATEST_STABLE"
            
            # Delete old appcast from stable release
            gh release delete-asset "$LATEST_STABLE" appcast.xml --yes 2>/dev/null || true
            
            # Upload merged appcast to stable release
            gh release upload "$LATEST_STABLE" build/release/appcast.xml --clobber
            
            echo "Updated appcast.xml on $LATEST_STABLE with merged entries"
          else
            echo "No stable release found to update"
          fi

      # ===========================================
      # 9. Summary
      # ===========================================
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ steps.version.outputs.IS_PRERELEASE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -la build/release/ >> $GITHUB_STEP_SUMMARY

      # ===========================================
      # 10. Trigger homebrew-tap update
      # ===========================================
      - name: Trigger homebrew-tap update
        # 二开仓库只有显式配置自己的 tap 后才通知，不能继续向上游仓库发送发布事件。
        if: steps.version.outputs.IS_PRERELEASE == 'false' && vars.HOMEBREW_TAP_REPOSITORY != ''
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [[ "${TAP_REPOSITORY}" == "${GITHUB_REPOSITORY_OWNER}/"* ]] || { echo "Tap must belong to this repository owner"; exit 1; }
          curl -X POST \
            -H "Authorization: token ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${TAP_REPOSITORY}/dispatches" \
            -d '{"event_type":"quotio-release","client_payload":{"version":"${{ steps.version.outputs.VERSION }}"}}'
